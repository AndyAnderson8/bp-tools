[build-system]
requires = ["setuptools~=82.0.0", "wheel~=0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "bp_tools"
version = "0.2.0"
description = "A collection of automation tools for BrickPlanet."
dependencies = [
    "requests~=2.32.5",
    "pyyaml~=6.0.2",
]

[project.optional-dependencies]
dev = [
    "black~=26.1.0",
    "flake8-pyproject~=1.2.4",
    "isort~=7.0.0",
    "mypy~=1.19.1",
    "pyinstaller~=6.18.0",
    "pytest~=9.0.2",
    "types-requests~=2.32.4.20260107",
    "types-pyyaml~=6.0.12.20250516",
]

[tool.flake8]
max-complexity = 10
max-line-length = 100
exclude = [
    ".venv",
    "build"
]

[tool.mypy]
python_version = "3.14"
exclude = "^(build|.venv)/"

[tool.setuptools.packages.find]
where = ["."]
include = ["bp_tools*"]
