api_tokens:
  - username: "YourUsername"
    token: "your_api_token_here"

  - username: "AltAccount"
    token: "your_alt_api_token_here"

tools:
  - uuid: 2a0b9214-7f29-41f2-b913-067ff45fc778  # item_sniper
    enabled: true
    poll-interval: 2
    config:
      users:
        - username: "Revolt"
          # max-credits: 10000
          # max-bits: 50000
          rares-only: false
        - username: "RevoIt"
          # max-credits: 10000
          # max-bits: 50000
          rares-only: true
      credit-to-bits-ratio: 40

  - uuid: 121ce010-69e4-41c0-84af-0aac360b32df  # trade_currency
    enabled: true
    poll-interval: 60
    config:
      username: "Revolt"
      offer-bits:
        amount: 200000
        max-rate: 40.00
      offer-credits:
        amount: 15000
        max-rate: 70.00

  - uuid: 8e61f94d-9ac5-4ca9-b1d9-ef60f0aa6a05  # rare_snagger
    enabled: true
    poll-interval: 5
    config:
      username: "Revolt"
      max-credits: 3
      rap-percentage: 5
      overrides:
        - item-id: 26782  # Lion's Crate
          max-credits: 20
        - item-id: 26781  # Dragon-Forged Blade
          max-credits: 400
        - item-id: 26790  # Helm of the Rogue Prince
          max-credits: 200

  - uuid: a3c2e7f1-5b8d-4f9a-b6e2-d9f1a4c8e3b7  # rare_offerer
    enabled: true
    poll-interval: 10
    config:
      username: "Revolt"
      base-offer: 2
